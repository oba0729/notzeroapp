<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css" />
    <title>Notzero Chats</title>
</head>
<body>
    <div class="main-container">
        <div class="column-1">
            <div class="logo-container">
                <span>...</span>
                <h3>Notzero Chats</h3>
            </div>

            <div class="search-container">
                <input type="text" id="searchInputs" placeholder="Search conversations" />
                <span id="editBtn" class="edit-box">📝</span>
            </div>

            <div class="tab-container">
                <div class="tabs active" id="all">
                    All
                </div>
                <div class="tabs" id="unread">
                    Unread
                </div>
                <div class="tabs" id="groups">
                    Groups
                </div>
            </div>

            <section class="conversations" id="conversations"></section>

            <div class="bottom-user">
                <div style="display: flex; align-items: center; justify-content: space-between; margin: 20px 0px;">
                    <div class="user-container">
                        <img src="/media//user.png" alt="user" class="user-img" width="50px" height="50px" />
                        <div>
                            <p>John Doe</p>
                            <p>Online</p>
                        </div>
                    </div>
                    <div class="settings-container">
                        ⚙️
                    </div>
                </div>
            </div>
        </div>

        <div class="column-2">
            <div class="chatHeader" id="chatHeader"></div>
            <div class="chatMessages" id="chatMessages"></div>

            <div class="form" id="form">
                <input id="messageInput" class="sendBtn" type="text" placeholder="Type a message..." />
                <button id="sendBtn" class="sendBtn">
                    send
                </button>
            </div>
        </div>
        
        <div class="column-3">
            <div class="profile-container" id="profile-container"></div>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
